<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Skill Library</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #1d2736;
        --muted: #5e6b7a;
        --line: #dfe7f1;
        --accent: #2457f5;
        --accent-soft: #edf2ff;
        --tag: #eef7f0;
        --tag-text: #1d5c3f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, sans-serif;
        line-height: 1.5;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      .hero {
        background: linear-gradient(135deg, #eaf0ff, #f8faff);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px 28px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }
      .subtitle {
        color: var(--muted);
        margin: 0;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0 24px;
      }
      .filter-group {
        margin-bottom: 20px;
      }
      .filter-label {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .filter-btn {
        border: 1px solid var(--line);
        background: white;
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 600;
      }
      .filter-btn.active {
        background: var(--accent-soft);
        border-color: #bfd0ff;
        color: var(--accent);
      }
      .category {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 20px 8px;
        margin-bottom: 20px;
      }
      .category h2 {
        margin: 0 0 16px;
        font-size: 1.4rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        vertical-align: top;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }
      th {
        background: #f8fafc;
        font-size: 0.82rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
      }
      td {
        font-size: 0.96rem;
      }
      .tag {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--tag);
        color: var(--tag-text);
        font-size: 0.75rem;
        font-weight: bold;
      }
      .llm-tag {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .skill-name {
        font-weight: 700;
      }
      .skill-compatibility {
        margin-left: 7px;
        vertical-align: middle;
      }
      .individual-installation {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .individual-installation code {
        color: var(--ink);
        word-break: break-word;
      }
      .muted { color: var(--muted); }
      @media (max-width: 760px) {
        table, thead, tbody, th, td, tr {
          display: block;
        }
        thead { display: none; }
        tr {
          padding: 12px 0;
          border-bottom: 1px solid var(--line);
        }
        td {
          border: none;
          padding: 6px 0;
        }
        td::before {
          content: attr(data-label);
          display: block;
          color: var(--muted);
          font-weight: 700;
          margin-bottom: 2px;
          font-size: 0.72rem;
          text-transform: uppercase;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <h1>AI Skill Library</h1>
        <p class="subtitle">Übersicht zu AI-Agent-Skills, Review-Tools und Produktivitäts-Workflows.</p>
      </div>

      <div class="filters" id="filters"></div>
      <div id="content"></div>
    </div>

    <script>
      const categories = [
        'All',
        'Best Practices',
        'Context Shaping',
        'Main Flow Shaping',
        'Upkeep',
        'Productivity'
      ];
      const llmOptions = ['All', 'Claude only', 'Codex only', 'Both', 'Other / tool-specific'];
      const compatibilityLabels = {
        'Both': 'Claude Code + Codex',
        'Claude only': 'Claude Code only',
        'Codex only': 'Codex only',
        'Other / tool-specific': 'Other tool only'
      };

      fetch('data/skills.json')
        .then(response => response.json())
        .then(data => {
          const filters = document.getElementById('filters');
          const content = document.getElementById('content');
          let activeCategory = 'All';
          let activeLlm = 'All';

          function renderFilters() {
            filters.innerHTML = `
              <div class="filter-group">
                <span class="filter-label">Kategorie</span>
                <div class="filter-row">
                  ${categories.map(cat => `
                    <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" data-category="${cat}">${cat}</button>
                  `).join('')}
                </div>
              </div>
              <div class="filter-group">
                <span class="filter-label">LLM-Kompatibilität</span>
                <div class="filter-row">
                  ${llmOptions.map(llm => `
                    <button class="filter-btn ${llm === activeLlm ? 'active' : ''}" data-llm="${llm}">${llm}</button>
                  `).join('')}
                </div>
              </div>`;

            filters.querySelectorAll('.filter-btn').forEach(button => {
              button.addEventListener('click', () => {
                if (button.dataset.category) activeCategory = button.dataset.category;
                if (button.dataset.llm) activeLlm = button.dataset.llm;
                renderFilters();
                renderContent();
              });
            });
          }

          function renderContent() {
            const visible = data.filter(item =>
              (activeCategory === 'All' || item.category === activeCategory) &&
              (activeLlm === 'All' || item.llmCompatibility === activeLlm)
            );

            const grouped = visible.reduce((acc, item) => {
              acc[item.category] = acc[item.category] || [];
              acc[item.category].push(item);
              return acc;
            }, {});

            content.innerHTML = Object.entries(grouped).map(([category, items]) => `
              <section class="category">
                <h2>${category}</h2>
                <table>
                  <thead>
                    <tr>
                      <th>Skill</th>
                      <th>LLM / Ökosystem</th>
                      <th>Herkunft</th>
                      <th>Typ</th>
                      <th>Installation</th>
                      <th>Zweck</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${items.map(item => `
                      <tr>
                        <td data-label="Skill"><span class="skill-name">${item.skill}</span><span class="tag llm-tag skill-compatibility">${compatibilityLabels[item.llmCompatibility]}</span></td>
                        <td data-label="LLM / Ökosystem">${item.ecosystem}</td>
                        <td data-label="Herkunft">${item.origin}</td>
                        <td data-label="Typ"><span class="tag">${item.type}</span></td>
                        <td data-label="Installation">
                          <div>${item.installation}</div>
                          ${item.individualInstallation ? `<div class="individual-installation">Einzeln installieren: <code>${item.individualInstallation}</code></div>` : ''}
                        </td>
                        <td data-label="Zweck">${item.purpose}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </section>
            `).join('');
          }

          renderFilters();
          renderContent();
        });
    </script>
  </body>
</html>
